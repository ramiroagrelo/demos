<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<style>body{margin:0;background:#222;font-family:sans-serif;color:#fff}.r{display:flex;gap:4px;margin:4px}.r img{width:300px;height:375px;object-fit:cover;background:#444}</style></head>
<body><div id="g"></div><script>
const p=new URLSearchParams(location.search).get('f')||'g1';
fetch(p+'.json').then(r=>r.json()).then(rows=>{for(const row of rows){const d=document.createElement('div');d.className='r';for(const u of row){const i=document.createElement('img');i.src=u;i.referrerPolicy='no-referrer';d.appendChild(i)}document.getElementById('g').appendChild(d)}})
</script></body></html>
